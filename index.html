<!DOCTYPE html>

<body>
<h1>rclone-backup</h1>
<p>個人用のPCバックアップツールです。開発者本人のPCのバックアップを、本人のGoogleドライブに保存するためだけに使います。</p>
<h2 id="privacy">プライバシーポリシー</h2>
<p>このアプリは drive.file 権限のみを使い、アプリ自身が作成したファイルにだけアクセスします。データを第三者に送信・共有することはありません。問い合わせ: GitHubのこのリポジトリのIssueまで。</p>
</body></html>
